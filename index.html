<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Xerra Linktree</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-[#0f1117] text-white min-h-screen flex items-center md:items-start justify-center p-4 sm:p-8 md:pt-30">

  <div class="w-full max-w-md md:max-w-2xl bg-[#181c25] rounded-3xl p-6 sm:p-10 md:p-16 shadow-2xl text-center transition-all duration-300">

    <a href="#" class="inline-block group">
      <img
        src="xerra.jpg"
        class="w-24 h-24 sm:w-28 sm:h-28 md:w-36 md:h-36 rounded-full mx-auto border-4 border-blue-500 transform group-hover:scale-105 transition duration-300 object-cover"
        alt="Xerra Profile"
      >
    </a>

    <h1 class="text-2xl sm:text-3xl md:text-5xl font-bold mt-5 md:mt-7 tracking-wide">
      Xerra.
    </h1>

    <p class="text-gray-400 mt-2 md:mt-3 text-sm md:text-lg tracking-wide">
      lowkey, but not empty
    </p>

    <div class="mt-8 md:mt-14 space-y-4 md:space-y-6">
      
      <a href="https://xerra-m.github.io/Xerra-portofolio-website/"
      class="flex items-center bg-[#232938] hover:bg-blue-400 hover:scale-[1.01] transition-all duration-300 p-4 md:p-6 rounded-2xl group px-6 md:px-10">
        <i class="fa-solid fa-code text-lg md:text-3xl w-10 text-left text-blue-400 group-hover:text-white"></i>
        <span class="flex-1 text-center font-semibold md:text-2xl pr-10">Portfolio</span>
      </a>

      <a href="#"
      class="flex items-center bg-[#232938] hover:bg-pink-600 hover:scale-[1.01] transition-all duration-300 p-4 md:p-6 rounded-2xl group px-6 md:px-10">
        <i class="fa-brands fa-instagram text-lg md:text-3xl w-10 text-left text-pink-400 group-hover:text-white"></i>
        <span class="flex-1 text-center font-semibold md:text-2xl pr-10">Instagram</span>
      </a>

      <a href="https://github.com/Xerra-m"
      class="flex items-center bg-[#232938] hover:bg-zinc-700 hover:scale-[1.01] transition-all duration-300 p-4 md:p-6 rounded-2xl group px-6 md:px-10">
        <i class="fa-brands fa-github text-lg md:text-3xl w-10 text-left text-gray-300 group-hover:text-white"></i>
        <span class="flex-1 text-center font-semibold md:text-2xl pr-10">GitHub</span>
      </a>

    </div>

    <p class="text-gray-500 text-xs md:text-base mt-10 md:mt-20">&copy; 2026 Xerra. All rights reserved.</p>
  </div>

</body>
</html>
